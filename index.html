<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | Permutation</title>
  <meta name="description" content="Catalyzing bold & purposeful innovation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1C2E3B;
      color: #ffffff;
      font-family: 'Work Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 40px;
    }

    .logo {
      font-size: 18px;
      font-weight: 400;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: 0.5px;
    }

    .twitter-link {
      display: flex;
      align-items: center;
    }

    .twitter-link svg {
      width: 22px;
      height: 22px;
    }

    /* Hero */
    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 60px 40px 80px;
    }

    .hero-cube svg {
      width: 150px;
      height: 143px;
    }

    .hero-text h1 {
      font-size: 28px;
      font-weight: 300;
      line-height: 1.4;
      letter-spacing: 0.5px;
    }

    .hero-text h1 strong {
      font-weight: 600;
    }

    /* Divider */
    .divider {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Portfolio */
    .portfolio {
      padding: 60px 40px 80px;
      text-align: center;
    }

    .portfolio h4 {
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 2px;
      margin-bottom: 50px;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px 60px;
      max-width: 600px;
      margin: 0 auto;
      align-items: center;
      justify-items: center;
    }

    .portfolio-grid a {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease;
    }

    .portfolio-grid a:hover {
      opacity: 0.7;
    }

    .portfolio-grid img {
      width: 148px;
      height: 148px;
      object-fit: contain;
    }

    /* Footer */
    footer {
      margin-top: auto;
      padding: 40px;
      text-align: center;
      font-size: 14px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.6);
    }

    /* Responsive */
    @media (max-width: 640px) {
      .hero {
        flex-direction: column;
        text-align: center;
        gap: 24px;
        padding: 40px 24px 60px;
      }

      .hero-text h1 {
        font-size: 22px;
      }

      .portfolio-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
      }

      .portfolio-grid img {
        width: 120px;
        height: 120px;
      }

      header {
        padding: 20px 24px;
      }

      .portfolio {
        padding: 40px 24px 60px;
      }
    }
  </style>
